# Dependabot: weekly pull requests for npm packages and GitHub Actions. CI runs on each one, including
# the smoke test and the packed-extension check, so a passing PR is safe to merge.
#
# Security updates (PRs for known vulnerabilities, outside this schedule) are switched on separately:
# Settings > Code security > Dependabot security updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it, so a broken or compromised version is
    # usually caught and pulled first. Security updates don't wait.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Runtime dependencies ship inside the .mcpb, so keep them in their own PR.
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
    # Major versions come as separate PRs (not grouped), since they may need code changes.
    ignore:
      # Matches the Node version in .nvmrc (22). Bump it together with .nvmrc, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
