name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks (${{ matrix.os }})
    # Windows too: most users of the extension will be on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Auth handling (lockout guard, password command, certificate errors)
        run: npm run check:auth
      - name: Smoke test (every tool, against the mock Juris Web API)
        run: npm run smoke
      - name: Build and check the Claude Desktop extension
        run: |
          npm run pack
          npm run check:bundle
